<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting&hellip;</title>
    <meta name="robots" content="noindex">
    <script>
        // Carry the Stripe session through, or the confirmation page lands with
        // nothing to look up and has to fall back to a generic thank-you.
        location.replace("/confirmation/" + window.location.search + window.location.hash);
    </script>
    <meta http-equiv="refresh" content="0; url=/confirmation/">
</head>
<body>
    <p>This page has moved to <a href="/confirmation/">mint-ai.tech/confirmation</a>.</p>
</body>
</html>
